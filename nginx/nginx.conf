# FeatureGuard nginx reverse proxy (nginx conf.d include)
#   /      -> React frontend (container "frontend")
#   /api/  -> FastAPI backend (container "backend"), prefix /api/ removed by the trailing slash
# The same file works in Docker Compose and Kubernetes because the service names match.
server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
