# FeatureGuard stack - run from the repository root:
#   docker compose --env-file .env -f deployment/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - appnet

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: featureguard-backend:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DRIFT_ENGINE: ${DRIFT_ENGINE:-evidently}
      DRIFT_BATCH_SIZE: ${DRIFT_BATCH_SIZE:-30}
      DRIFT_SHARE_THRESHOLD: ${DRIFT_SHARE_THRESHOLD:-0.3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The approved model is baked into the image (models/ -> /app/models), so an image
    # tag = an application version + a model version. Rolling the image back rolls both back.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  frontend:
    build:
      context: ../frontend
    image: featureguard-frontend:${IMAGE_TAG:-latest}
    networks:
      - appnet

  nginx:
    build:
      context: ..
      dockerfile: nginx/Dockerfile
    image: featureguard-nginx:${IMAGE_TAG:-latest}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - appnet

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ../mlflow.db:/mlflow/mlflow.db
      - ../mlruns:/mlflow/artifacts
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - appnet

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - appnet
  # Jenkins runs locally on the host (port 8080) - no container needed.
  # Point your local Jenkins at this project's Jenkinsfile via "Pipeline from SCM".

volumes:
  pgdata:
  mlflowdata:
  promdata:
  grafanadata:

networks:
  appnet:
    driver: bridge
