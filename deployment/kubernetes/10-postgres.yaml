apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: featureguard
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi          # uses the cluster's default StorageClass (Docker Desktop / Minikube both have one)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: featureguard
spec:
  replicas: 1
  strategy:
    type: Recreate          # one pod owns the volume at a time
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: featureguard-config, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: featureguard-secret, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: featureguard-secret, key: POSTGRES_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: featureguard
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
