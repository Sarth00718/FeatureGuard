apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: featureguard
spec:
  replicas: 2
  revisionHistoryLimit: 5          # rollout history kept for "kubectl rollout undo"
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # old pods stay until new ones are Ready
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
      annotations:
        prometheus.io/scrape: "true"
    spec:
      containers:
        - name: backend
          image: featureguard-backend:1.0.0     # built locally; imagePullPolicy IfNotPresent
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: featureguard-config}
            - secretRef: {name: featureguard-secret}
          readinessProbe:                       # /ready -> 503 until DB + model are available
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                        # /health -> 200 while the process is alive
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: featureguard
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
