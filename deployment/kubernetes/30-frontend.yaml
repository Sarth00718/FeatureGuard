apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: featureguard
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: featureguard-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: featureguard
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
